services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules:delegated
      - claude_memory:/root/.claude
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_USER: root
      SURREAL_PASS: root
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default_network

  # Init container: el named volume se crea como root y la imagen oficial
  # de SurrealDB corre como nonroot (uid 65532). Sin chown previo, RocksDB
  # falla al escribir LOG. Este servicio corre una vez, chown el volumen
  # y termina; surrealdb depende de su finalización exitosa.
  surrealdb-init:
    image: busybox:latest
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /data/db && chmod 700 /data/db"]
    volumes:
      - surrealdb_data:/data/db
    restart: "no"

  surrealdb:
    image: surrealdb/surrealdb:latest
    restart: unless-stopped
    # Sin override de user: la imagen ya corre como nonroot (uid 65532).
    # RocksDB persistente; bind a 0.0.0.0 para que `app` lo alcance por nombre.
    command:
      - start
      - --user
      - root
      - --pass
      - root
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data/db
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    networks:
      - default_network
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  huygens-mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/mcp/.env
    environment:
      MCP_PORT: "3030"
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_USER: root
      SURREAL_PASS: root
    ports:
      - "3030:3030"
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default_network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3030/healthz').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  huygens-worker:
    build:
      context: ../backend/huygens-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/huygens-worker/.env
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_USER: root
      SURREAL_PASS: root
      POLL_INTERVAL_SECONDS: "2"
      CLARIFY_MODEL: gpt-4o-mini
      MCP_URL: http://huygens-mcp:3030/mcp
    depends_on:
      surrealdb:
        condition: service_healthy
      huygens-mcp:
        condition: service_healthy
    networks:
      - default_network

volumes:
  node_modules:
  claude_memory:
  surrealdb_data:

networks:
  default_network:
    driver: bridge
