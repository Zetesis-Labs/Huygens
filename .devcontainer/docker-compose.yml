services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules:delegated
      - claude_memory:/root/.claude
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_USER: root
      SURREAL_PASS: root
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default_network

  # Init container: el named volume se crea como root y la imagen oficial
  # de SurrealDB corre como nonroot (uid 65532). Sin chown previo, RocksDB
  # falla al escribir LOG. Este servicio corre una vez, chown el volumen
  # y termina; surrealdb depende de su finalización exitosa.
  surrealdb-init:
    image: busybox:latest
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /data/db && chmod 700 /data/db"]
    volumes:
      - surrealdb_data:/data/db
    restart: "no"

  surrealdb:
    # Pinned to v2.6 because surrealmcp v0.4.0's bundled SurrealDB Rust SDK
    # negotiates the legacy binary WS subprotocols (revision/msgpack) which
    # SurrealDB 3.x dropped — the handshake fails with "Server sent no
    # subprotocol". Stay on v2.6 until surrealmcp ships a 3.x-compatible SDK.
    image: surrealdb/surrealdb:v2.6.5
    restart: unless-stopped
    # Sin override de user: la imagen ya corre como nonroot (uid 65532).
    # RocksDB persistente; bind a 0.0.0.0 para que `app` lo alcance por nombre.
    command:
      - start
      - --user
      - root
      - --pass
      - root
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data/db
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    networks:
      - default_network
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  huygens-mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/mcp/.env
    environment:
      MCP_PORT: "3030"
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_USER: root
      SURREAL_PASS: root
      SURREALMCP_URL: http://surrealmcp:8080/mcp
      # Pinned by huygens-mcp at boot via the upstream's connect_endpoint —
      # surrealmcp:v0.4.0 starts unbound and refuses query/select otherwise.
      # SURREALMCP_DB_URL must match the upstream's own SURREALDB_URL.
      # NOTE: surrealmcp:v0.4.0's bundled Rust SDK only authenticates against
      # the ROOT scope — DB-scope users (huygens_reader) get "auth failed".
      # Until upstream fixes that, the proxy connects as root; the read-only
      # contract is enforced solely by Huygens' allowlist (query, select, info).
      SURREALMCP_DB_URL: ws://surrealdb:8000/rpc
      SURREALMCP_DB_NS: huygens
      SURREALMCP_DB_NAME: main
      SURREALMCP_DB_USER: root
      SURREALMCP_DB_PASS: root
    ports:
      - "3030:3030"
    depends_on:
      surrealdb:
        condition: service_healthy
      surrealmcp:
        condition: service_started
    networks:
      - default_network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3030/healthz').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  surrealmcp:
    image: surrealdb/surrealmcp:v0.4.0
    restart: unless-stopped
    command:
      - start
      - --bind-address
      - 0.0.0.0:8080
      - --auth-disabled
    env_file:
      - ../apps/mcp/.env
    environment:
      SURREALDB_URL: ws://surrealdb:8000/rpc
      SURREALDB_NS: huygens
      SURREALDB_DB: main
      SURREALDB_USER: huygens_reader
      SURREAL_MCP_SERVER_URL: http://surrealmcp:8080
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default_network

  huygens-worker:
    profiles: ["worker"]
    build:
      context: ../backend/huygens-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/huygens-worker/.env
    environment:
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
      MCP_URL: http://huygens-mcp:3030/mcp
    depends_on:
      surrealdb:
        condition: service_healthy
      huygens-mcp:
        condition: service_healthy
    networks:
      - default_network

volumes:
  node_modules:
  claude_memory:
  surrealdb_data:

networks:
  default_network:
    driver: bridge
