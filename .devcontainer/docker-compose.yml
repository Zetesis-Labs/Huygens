services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules:delegated
      - claude_memory:/root/.claude
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_USER: root
      SURREAL_PASS: root
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default_network

  # Init container: el named volume se crea como root y la imagen oficial
  # de SurrealDB corre como nonroot (uid 65532). Sin chown previo, RocksDB
  # falla al escribir LOG. Este servicio corre una vez, chown el volumen
  # y termina; surrealdb depende de su finalización exitosa.
  surrealdb-init:
    image: busybox:latest
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /data/db && chmod 700 /data/db"]
    volumes:
      - surrealkv_data:/data/db
    restart: "no"

  surrealdb:
    # Latest stable. The previous pin to v2.6 was for surrealmcp v0.4.0
    # compatibility; we replaced that proxy with native `query_*` tools in
    # huygens-mcp, so the version cap no longer applies.
    image: surrealdb/surrealdb:v3.0.5
    restart: unless-stopped
    # Sin override de user: la imagen ya corre como nonroot (uid 65532).
    # RocksDB persistente; bind a 0.0.0.0 para que `app` lo alcance por nombre.
    command:
      - start
      - --user
      - root
      - --pass
      - root
      - --bind
      - 0.0.0.0:8000
      # SurrealKV con versionado: habilita time-travel (VERSION) y changefeed
      # real. RocksDB no los soporta. Volumen nuevo (surrealkv_data); el viejo
      # surrealdb_data queda intacto para rollback.
      - "surrealkv:/data/db?versioned=true"
    ports:
      - "8000:8000"
    volumes:
      - surrealkv_data:/data/db
    depends_on:
      surrealdb-init:
        condition: service_completed_successfully
    networks:
      - default_network
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  huygens-mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/mcp/.env
    environment:
      MCP_PORT: "3030"
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_USER: root
      SURREAL_PASS: root
      # `query_*` tools sign in as huygens_reader (VIEWER) so writes are
      # rejected at the DB level. Create the user once with
      # `bun run db:define-reader` and put SURREAL_READER_PASS in
      # apps/mcp/.env (loaded via env_file above).
      SURREAL_READER_USER: huygens_reader
    ports:
      - "3030:3030"
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default_network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3030/healthz').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  huygens-dashboard:
    image: oven/bun:1-debian
    working_dir: /workspace
    # Dev server with live source (workspace bind). SSR reads SurrealDB as the
    # read-only reader; bound to 0.0.0.0:4321 and the port is published.
    command: ["sh", "-c", "bun --filter '@huygens/dashboard' dev"]
    restart: unless-stopped
    env_file:
      - ../apps/mcp/.env
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NS: huygens
      SURREAL_DB: main
      SURREAL_READER_USER: huygens_reader
    ports:
      - "4321:4321"
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules:delegated
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - default_network

  huygens-worker:
    profiles: ["worker"]
    build:
      context: ../backend/huygens-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/huygens-worker/.env
    environment:
      WORKER_ENABLED: ${WORKER_ENABLED:-false}
      MCP_URL: http://huygens-mcp:3030/mcp
    depends_on:
      surrealdb:
        condition: service_healthy
      huygens-mcp:
        condition: service_healthy
    networks:
      - default_network

volumes:
  node_modules:
  claude_memory:
  surrealdb_data:   # RocksDB legacy: conservado intacto para rollback
  surrealkv_data:   # SurrealKV (versionado), motor activo

networks:
  default_network:
    driver: bridge
