{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huygens.secretName" . }}
  labels:
    {{- include "huygens.labels" . | nindent 4 }}
type: Opaque
stringData:
  SURREAL_PASS: {{ .Values.secret.surrealPass | quote }}
  SURREAL_READER_PASS: {{ .Values.secret.surrealReaderPass | quote }}
  {{- range $k, $v := .Values.secret.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
