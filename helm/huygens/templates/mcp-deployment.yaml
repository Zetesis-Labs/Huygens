{{- if .Values.mcp.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "huygens.mcp.fullname" . }}
  labels:
    {{- include "huygens.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "huygens.selectorLabels" (dict "ctx" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "huygens.labels" . | nindent 8 }}
        {{- include "huygens.selectorLabels" (dict "ctx" . "component" "mcp") | nindent 8 }}
    spec:
      {{- include "huygens.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "huygens.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.mcp.applySchema }}
      initContainers:
        # Applies the SurrealDB schema (db:apply) and creates the read-only
        # huygens_reader user (db:define-reader). Retried by K8s until SurrealDB
        # is reachable; the MCP refuses to start otherwise (assertSchemaReady).
        - name: apply-schema
          image: {{ include "huygens.mcp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "bun run db:apply && bun run db:define-reader"]
          envFrom:
            - configMapRef:
                name: {{ include "huygens.fullname" . }}-config
            - secretRef:
                name: {{ include "huygens.secretName" . }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "huygens.mcp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: MCP_PORT
              value: {{ .Values.mcp.port | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "huygens.fullname" . }}-config
            - secretRef:
                name: {{ include "huygens.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
