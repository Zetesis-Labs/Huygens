name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, self-contained gate: no database, no secrets. Catches type and style
  # regressions on every PR.
  static:
    runs-on: cardano-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format (biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  # Test gate: runs the MCP test suite against a throwaway SurrealDB. The suite
  # is hermetic — embeddings are stubbed via setEmbedderOverride — so no external
  # provider or API key is needed.
  test:
    runs-on: cardano-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3.0.5 \
            start --user root --pass root --bind 0.0.0.0:8000 memory

      - name: Wait for SurrealDB to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec surrealdb /surreal isready --endpoint http://localhost:8000; then
              echo "SurrealDB ready"; exit 0
            fi
            sleep 2
          done
          echo "SurrealDB did not become ready in time" >&2
          docker logs surrealdb >&2 || true
          exit 1

      - name: Run tests
        env:
          SURREAL_URL: ws://localhost:8000/rpc
          SURREAL_NS: huygens
          SURREAL_DB: main
          SURREAL_USER: root
          SURREAL_PASS: root
        run: bun run test

      - name: Stop SurrealDB
        if: always()
        run: docker rm -f surrealdb || true

  # Worker gate: the Python dashboard agent (Agno + OpenAI). Self-contained — no
  # DB, no secrets, no network (the OpenAI client is only constructed at runtime).
  # Lint + types + unit tests, all via uv against the committed lockfile.
  worker:
    runs-on: cardano-runners
    defaults:
      run:
        working-directory: backend/huygens-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked, incl. dev group)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy huygens_worker

      - name: Run tests (pytest)
        run: uv run pytest
