[project]
name = "huygens-worker"
version = "0.1.0"
description = "Autonomous inbox processor for Huygens. Watches raw_capture via CHANGEFEED and runs clarify via the MCP."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rubén García" }]
dependencies = [
    "surrealdb>=2.0.0,<3",
    "pydantic-settings>=2.6",
    "uuid7>=0.1.0",
]

[project.scripts]
huygens-worker = "huygens_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huygens_worker"]
