[project]
name = "huygens-worker"
version = "0.3.0"
description = "Worker shell for future specialized Huygens MCP agents."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rubén García" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.6",
    "mcp>=1.0",
    # Dashboard chat agent served over AG-UI.
    "agno>=2.0",
    "openai>=1.0",
    "ag-ui-protocol>=0.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
huygens-worker = "huygens_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huygens_worker"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "S", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Pragmatic strict-ish: catch real bugs without fighting third-party SDK quirks.
# The MCP SDK is dynamic enough that strict import typing is not useful here.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
